<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAW Timesheet — How to Use the App (Staff Guide)</title>
<style>
  :root{
    --primary:#1E3A8A;
    --primary-d:#162C6B;
    --success:#059669;
    --success-l:#10B981;
    --danger:#DC2626;
    --amber:#F59E0B;
    --bg:#0b1220;
    --screen-bg:#F3F4F6;
    --text:#1F2937;
    --muted:#6B7280;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%,#1b2b56 0%,#0b1220 60%);
    color:#fff;display:flex;flex-direction:column;align-items:center;
    min-height:100vh;overflow-x:hidden;
  }

  /* ---- Top bar ---- */
  .topbar{width:100%;max-width:1100px;display:flex;align-items:center;justify-content:space-between;padding:18px 24px 4px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .logo{width:40px;height:40px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;}
  .brand .logo svg{width:26px;height:26px;}
  .brand h1{font-size:18px;font-weight:800;letter-spacing:.3px;}
  .brand p{font-size:12px;color:#9fb0d8;font-weight:500;}
  .rec-tip{font-size:12px;color:#cdd8f3;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);padding:8px 12px;border-radius:10px;max-width:330px;line-height:1.4;}
  .rec-tip b{color:#fff;}

  /* ---- Stage ---- */
  .stage{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:10px 16px 24px;}

  /* ---- Phone ---- */
  .phone{
    width:340px;height:710px;background:#000;border-radius:46px;padding:12px;
    box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 2px #2a3970 inset;position:relative;flex:none;
  }
  .phone .notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:130px;height:26px;background:#000;border-radius:0 0 16px 16px;z-index:20;}
  .scr{position:relative;width:100%;height:100%;background:var(--screen-bg);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;}
  #screen{flex:1;display:flex;flex-direction:column;min-height:0;}
  .statusbar{height:34px;background:var(--primary);display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 5px;color:#fff;font-size:12px;font-weight:600;flex:none;}
  .statusbar .icons{display:flex;gap:6px;align-items:center;}
  .appbar{background:var(--primary);color:#fff;padding:10px 16px 14px;font-weight:700;font-size:17px;flex:none;display:flex;align-items:center;gap:10px;}
  .appbar .back{font-size:20px;font-weight:400;opacity:.9;}
  .body{flex:1;overflow:hidden;padding:14px;position:relative;}
  .tabbar{flex:none;height:60px;background:#fff;border-top:1px solid #e5e7eb;display:flex;}
  .tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9.5px;color:#9aa3b2;}
  .tabbar .tab.active{color:var(--primary);}
  .tabbar .tab .ico{font-size:18px;line-height:1;}

  /* fade animation */
  .screen-fade{animation:fade .45s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  /* ---- Generic card styles inside phone ---- */
  .card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:14px;}
  .row{display:flex;align-items:center;gap:8px;}
  .muted{color:var(--muted);font-size:13px;}
  .h{color:var(--text);font-weight:700;}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700;}
  .pill.green{background:#D1FAE5;color:#059669;}
  .pill.red{background:#FEE2E2;color:#DC2626;}
  .pill.amber{background:#FEF3C7;color:#D97706;}
  .btn{border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;}
  .btn.blue{background:var(--primary);}
  .btn.green{background:var(--success-l);}
  .btn.red{background:var(--danger);}
  .btn.ghost-red{background:#FEF2F2;color:#DC2626;border:1px solid #FCA5A5;}
  .field{background:#fff;border:1px solid #e2e6ee;border-radius:10px;padding:12px;color:#9aa3b2;font-size:14px;margin-bottom:12px;}
  .label{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
  .sectiontitle{font-size:16px;font-weight:700;color:var(--text);margin:4px 4px 12px;}

  /* highlight ring for callouts */
  .ring{box-shadow:0 0 0 3px rgba(245,158,11,.0);animation:ring 1.6s ease-in-out infinite;border-radius:14px;}
  @keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.0);}50%{box-shadow:0 0 0 4px rgba(245,158,11,.55);}}

  /* ---- Caption ---- */
  .caption{max-width:760px;text-align:center;font-size:19px;line-height:1.55;color:#eaf0ff;min-height:64px;padding:0 8px;font-weight:500;}
  .caption b{color:#ffd479;}

  /* ---- Controls ---- */
  .controls{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);padding:10px 16px;border-radius:999px;}
  .ctrl{background:none;border:none;color:#fff;cursor:pointer;font-size:15px;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;font-weight:600;}
  .ctrl:hover{background:rgba(255,255,255,.12);}
  .ctrl.primary{background:var(--success-l);}
  .ctrl.primary:hover{background:#0f9e6e;}
  .slidecount{font-size:13px;color:#9fb0d8;min-width:54px;text-align:center;}

  /* progress */
  .progress{width:100%;max-width:1100px;height:4px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;}
  .progress .bar{height:100%;width:0;background:linear-gradient(90deg,#10B981,#60a5fa);transition:width .3s linear;}
  .dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:760px;}
  .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;}
  .dot.active{background:#10B981;transform:scale(1.25);}
  .foot{font-size:12px;color:#8595bd;padding:6px 0 22px;text-align:center;}
  @media (max-width:760px){.rec-tip{display:none;} .phone{transform:scale(.92);}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 64 64" fill="none"><ellipse cx="32" cy="32" rx="30" ry="30" fill="#1E3A8A"/><path d="M10 38c14-10 30-12 44-6M12 30c12-9 28-11 40-6M16 23c9-6 21-8 31-5" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      </div>
      <div>
        <h1>RAW Timesheet</h1>

      </div>
    </div>
    <div class="rec-tip">🎥 <b>To make a video:</b> press <b>Play</b>, then screen-record this window (Mac: <b>⇧⌘5</b>). Turn your sound on to capture the voice-over.</div>
  </div>

  <div class="progress"><div class="bar" id="bar"></div></div>

  <div class="stage">
    <div class="phone">

    </div>
    <div class="foot">RAW Labour Hire · Questions? Call or text Josh McPherson on 0424 142 040</div>

/* ---------------- Player ---------------- */
let idx = 0, playing = false, muted = false, timer = null;
const screenEl = document.getElementById('screen');
const capEl = document.getElementById('caption');
const barEl = document.getElementById('bar');
const countEl = document.getElementById('count');
const dotsEl = document.getElementById('dots');
const playBtn = document.getElementById('play');
const muteBtn = document.getElementById('mute');

// build dots
slides.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';d.onclick=()=>{stop();go(i);};dotsEl.appendChild(d);});
const dots=[...dotsEl.children];

function clock(){const n=new Date();let h=n.getHours();const m=String(n.getMinutes()).padStart(2,'0');const ap=h>=12?'':'';h=h%12||12;document.getElementById('clock').textContent=`${h}:${m}`;}
clock();setInterval(clock,10000);

function estDur(text){ return Math.max(3800, Math.min(13000, text.length*55)); }

function render(i){
  const sl = slides[i];
  // The status bar lives in .scr (outside #screen); just swap the screen body.
  screenEl.innerHTML = screens[sl.s]();
  const body = screenEl.querySelector('.body');
  if(body) body.classList.add('screen-fade');
  capEl.innerHTML = sl.cap;
  countEl.textContent = `${i+1} / ${slides.length}`;
  barEl.style.width = `${((i+1)/slides.length)*100}%`;
  dots.forEach((d,k)=>d.classList.toggle('active',k===i));
}

/* ---- Voice selection (prefer a male Australian voice) ---- */
let chosenVoice = null;
const voiceSel = document.getElementById('voiceSel');
// Known male voice names across macOS / Windows / Chrome
const MALE_HINTS = ['lee','daniel','gordon','james','rishi','aaron','fred','alex','arthur','george','guy','william','liam','oliver','jamie','matthew','mark','male'];
const FEMALE_HINTS = ['karen','catherine','samantha','victoria','tessa','fiona','moira','serena','female','zira','hazel','allison','ava','susan','nicky'];

function scoreVoice(v){
  const n = (v.name||'').toLowerCase();
  const lang = (v.lang||'').toLowerCase();
  let s = 0;
  if(lang.includes('en-au')) s += 100;          // Australian first
  else if(lang.includes('en-gb')) s += 40;      // then UK
  else if(lang.startsWith('en')) s += 20;       // then any English
  if(MALE_HINTS.some(h=>n.includes(h))) s += 50; // male bonus
  if(FEMALE_HINTS.some(h=>n.includes(h))) s -= 50; // female penalty
  if(/male/.test(n) && !/female/.test(n)) s += 10;
  return s;
}

function buildVoiceList(){
  const voices = (window.speechSynthesis ? window.speechSynthesis.getVoices() : [])
    .filter(v=>/en/i.test(v.lang))
    .sort((a,b)=>scoreVoice(b)-scoreVoice(a));
  if(!voices.length) return;
  voiceSel.innerHTML = voices.map((v,i)=>`<option value="${v.name}">${v.name} (${v.lang})</option>`).join('');
  // auto-pick the best (top of sorted list)
  chosenVoice = voices[0];
  voiceSel.value = chosenVoice.name;
  voiceSel.onchange = ()=>{ chosenVoice = voices.find(v=>v.name===voiceSel.value) || chosenVoice; };
}

function speak(text, onEnd){
  if(muted || !('speechSynthesis' in window)){ timer=setTimeout(onEnd, estDur(text)); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.92; u.pitch = 0.95;   // a touch slower & lower for a calm male read
  if(chosenVoice) u.voice = chosenVoice;
  u.onend = ()=>{ if(playing) onEnd(); };
  // safety fallback in case onend never fires
  timer = setTimeout(()=>{ if(playing){ window.speechSynthesis.cancel(); onEnd(); } }, estDur(text)+6000);
  window.speechSynthesis.speak(u);
}

function playCurrent(){
  render(idx);
  speak(slides[idx].say, ()=>{
    clearTimeout(timer);
    if(idx < slides.length-1){ idx++; playCurrent(); }
    else { playing=false; updatePlayBtn(); }
  });
}

function play(){ if(playing) return; playing=true; updatePlayBtn(); playCurrent(); }
function pause(){ playing=false; updatePlayBtn(); clearTimeout(timer); if('speechSynthesis' in window) window.speechSynthesis.cancel(); }
function stop(){ pause(); }
function go(i){ idx=Math.max(0,Math.min(slides.length-1,i)); render(idx); }
function updatePlayBtn(){ playBtn.textContent = playing ? '⏸ Pause' : '▶ Play'; }

playBtn.onclick = ()=> playing ? pause() : play();
document.getElementById('next').onclick = ()=>{ const wasPlaying=playing; pause(); go(idx+1); if(wasPlaying) play(); };
document.getElementById('prev').onclick = ()=>{ const wasPlaying=playing; pause(); go(idx-1); if(wasPlaying) play(); };
document.getElementById('restart').onclick = ()=>{ pause(); idx=0; render(0); };
muteBtn.onclick = ()=>{ muted=!muted; muteBtn.textContent = muted ? '🔇 Muted' : '🔊 Voice'; if(muted && 'speechSynthesis' in window) window.speechSynthesis.cancel(); };

// keyboard
document.addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault(); playBtn.click();} if(e.code==='ArrowRight')document.getElementById('next').click(); if(e.code==='ArrowLeft')document.getElementById('prev').click(); });

// preload voices then render first slide
if('speechSynthesis' in window){
  buildVoiceList();
  window.speechSynthesis.onvoiceschanged = buildVoiceList; // voices often load async
}
render(0);
</script>
